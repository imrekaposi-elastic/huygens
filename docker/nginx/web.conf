server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No trailing slash on prefix locations — otherwise nginx 301s to :80 and breaks the SPA.
    location /api/v1/auth {
        proxy_pass http://iam:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/v1/organizations {
        proxy_pass http://iam:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/v1/platform {
        proxy_pass http://iam:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/v1/inventory {
        proxy_pass http://inventory:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
    location /api/v1/projects {
        proxy_pass http://projects:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/v1/agents {
        proxy_pass http://registry:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/v1/infrastructure-providers {
        proxy_pass http://registry:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/v1/agent-technologies {
        proxy_pass http://registry:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# Docker's embedded DNS; re-resolve upstreams so recreated containers don't 502.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No trailing slash on prefix locations — otherwise nginx 301s to :80 and breaks the SPA.
    location /api/v1/ssh {
        set $upstream http://ssh-gateway:8087;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400;
    }
    location /api/v1/auth {
        set $upstream http://iam:8081;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location ~ ^/api/v1/organizations/[^/]+/(ipam|network-links|topology) {
        set $upstream http://projects:8084;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location ~ ^/api/v1/organizations/[^/]+/(compliance-catalog|compliance-checks|compliance-dashboard|compliance-explorer[^?]*|compliance-standards|compliance-controls|compliance-cycles|compliance-packs|compliance-export|compliance-evidence|qualitative-characteristics|regions/[^/]+/(traits|compliance-items|characteristics)|traits/|projects/[^/]+/(criticality|resources)|resources/) {
        set $upstream http://compliance:8086;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location ~ ^/api/v1/organizations/[^/]+/infrastructure-providers/[^/]+/(traits|compliance-profile|characteristics) {
        set $upstream http://compliance:8086;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/v1/organizations {
        set $upstream http://iam:8081;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/v1/platform {
        set $upstream http://iam:8081;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/v1/users {
        set $upstream http://iam:8081;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/v1/inventory {
        set $upstream http://inventory:8083;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
    location /api/v1/projects {
        set $upstream http://projects:8084;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/v1/agents {
        set $upstream http://registry:8082;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/v1/infrastructure-providers {
        set $upstream http://registry:8082;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/v1/agent-technologies {
        set $upstream http://registry:8082;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

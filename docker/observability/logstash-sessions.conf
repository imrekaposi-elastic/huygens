# Ingest huy.session.events into Elasticsearch (ECS session metadata).
input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["huy.session.events"]
    codec => json
    group_id => "huy-session-logstash"
    auto_offset_reset => "earliest"
  }
}

filter {
  if [data] {
    mutate {
      add_field => {
        "[session][id]" => "%{[data][session_id]}"
        "[organization][id]" => "%{[data][organization_id]}"
        "[huy][project][id]" => "%{[data][project_id]}"
        "[host][name]" => "%{[data][vm_name]}"
        "[agent][id]" => "%{[data][agent_id]}"
        "[user][id]" => "%{[data][user_id]}"
        "[user][email]" => "%{[data][user_email]}"
        "[user][name]" => "%{[data][user_username]}"
        "[process][user][name]" => "%{[data][linux_user]}"
        "[event][action]" => "%{[data][action]}"
        "[event][id]" => "%{[id]}"
        "[huy][recording][uri]" => "%{[data][recording_uri]}"
        "[huy][session][status]" => "%{[data][status]}"
        "[huy][session][started_at]" => "%{[data][started_at]}"
      }
    }
    if [data][ended_at] and [data][ended_at] != "" {
      mutate {
        add_field => { "[huy][session][ended_at]" => "%{[data][ended_at]}" }
      }
    }
    date {
      match => ["[data][timestamp]", "ISO8601"]
      target => "@timestamp"
    }
    if [data][guest_ip] and [data][guest_ip] != "" {
      mutate {
        add_field => { "[host][ip]" => "%{[data][guest_ip]}" }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "huy-sessions"
    action => "create"
    document_id => "%{[id]}"
    pipeline => "huy-sessions-ecs"
  }
}

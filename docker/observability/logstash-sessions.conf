# Ingest huy.session.events into Elasticsearch for session search and playback metadata.
input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["huy.session.events"]
    codec => json
    group_id => "huy-session-logstash"
    auto_offset_reset => "earliest"
  }
}

filter {
  if [data] {
    mutate {
      add_field => {
        "session_id" => "%{[data][session_id]}"
        "organization_id" => "%{[data][organization_id]}"
        "project_id" => "%{[data][project_id]}"
        "vm_name" => "%{[data][vm_name]}"
        "agent_id" => "%{[data][agent_id]}"
        "actor_user_id" => "%{[data][user_id]}"
        "linux_user" => "%{[data][linux_user]}"
        "session_action" => "%{[data][action]}"
        "recording_uri" => "%{[data][recording_uri]}"
      }
    }
  }
  mutate {
    add_field => { "event_kind" => "session" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "huy-sessions-%{+YYYY.MM.dd}"
    document_id => "%{[id]}"
  }
}

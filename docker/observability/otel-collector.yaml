# Legacy: contrib OpenTelemetry Collector (Discover-only; no Kibana service map).
# The observability Compose profile uses edot-collector-gateway.yaml (EDOT Collector) instead.
# Keep this file for reference or custom non-Elastic OTLP backends.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: basic
  elasticsearch:
    endpoints: [http://elasticsearch:9200]
    # Omit traces_index / logs_index / metrics_index so the exporter creates
    # OTel data streams (static index names + mapping.mode none/ecs → index_not_found).
    mapping:
      mode: otel

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, elasticsearch]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, elasticsearch]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, elasticsearch]

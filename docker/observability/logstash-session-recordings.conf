# Ingest huy.session.recording (asciicast terminal I/O) into Elasticsearch.
input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["huy.session.recording"]
    codec => json
    group_id => "huy-session-recording-logstash"
    auto_offset_reset => "earliest"
  }
}

filter {
  if [data] {
    mutate {
      add_field => {
        "session_id" => "%{[data][session_id]}"
        "organization_id" => "%{[data][organization_id]}"
        "project_id" => "%{[data][project_id]}"
        "vm_name" => "%{[data][vm_name]}"
        "agent_id" => "%{[data][agent_id]}"
        "user_id" => "%{[data][user_id]}"
        "user_email" => "%{[data][user_email]}"
        "user_username" => "%{[data][user_username]}"
        "linux_user" => "%{[data][linux_user]}"
        "recording_uri" => "%{[data][recording_uri]}"
        "cast_timestamp" => "%{[data][cast_timestamp]}"
        "stream" => "%{[data][stream]}"
        "terminal_data" => "%{[data][terminal_data]}"
        "terminal_plaintext" => "%{[data][terminal_plaintext]}"
        "sequence" => "%{[data][sequence]}"
        "[event][id]" => "%{[id]}"
      }
    }
    mutate {
      convert => {
        "cast_timestamp" => "float"
        "sequence" => "integer"
      }
    }
    if [data][guest_ip] and [data][guest_ip] != "" {
      mutate {
        add_field => { "guest_ip" => "%{[data][guest_ip]}" }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "huy-sessions"
    action => "create"
    document_id => "%{[data][session_id]}-%{[data][sequence]}"
    pipeline => "huy-session-terminal"
  }
}

# Ingest huy.audit.events (CloudEvents JSON) into Elasticsearch for Kibana Discover.
input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["huy.audit.events"]
    codec => json
    group_id => "huy-audit-logstash"
    auto_offset_reset => "earliest"
  }
}

filter {
  if [data] {
    mutate {
      add_field => {
        "organization_id" => "%{[data][organization_id]}"
        "audit_action" => "%{[data][action]}"
        "audit_outcome" => "%{[data][outcome]}"
        "audit_timestamp" => "%{[data][timestamp]}"
        "actor_user_id" => "%{[data][user_id]}"
      }
    }
    if [data][resource] {
      mutate {
        add_field => {
          "resource_type" => "%{[data][resource][type]}"
          "resource_id" => "%{[data][resource][id]}"
        }
      }
    }
    if [data][message] {
      mutate {
        add_field => { "message" => "%{[data][message]}" }
      }
    }
    if [data][trace_id] {
      mutate {
        add_field => { "trace_id" => "%{[data][trace_id]}" }
      }
    }
  }
  mutate {
    add_field => { "event_kind" => "audit" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "huy-audit-%{+YYYY.MM.dd}"
    document_id => "%{[id]}"
  }
  stdout {
    codec => dots
  }
}

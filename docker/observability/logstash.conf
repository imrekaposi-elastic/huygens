# Ingest huy.audit.events (CloudEvents JSON) into Elasticsearch (ECS).
input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["huy.audit.events"]
    codec => json
    group_id => "huy-audit-logstash"
    auto_offset_reset => "earliest"
  }
}

filter {
  if [data] {
    mutate {
      add_field => {
        "[organization][id]" => "%{[data][organization_id]}"
        "audit_action" => "%{[data][action]}"
        "audit_outcome" => "%{[data][outcome]}"
        "audit_timestamp" => "%{[data][timestamp]}"
        "[user][id]" => "%{[data][user_id]}"
        "[event][id]" => "%{[id]}"
      }
    }
    if [data][resource] {
      mutate {
        add_field => {
          "resource_type" => "%{[data][resource][type]}"
          "resource_id" => "%{[data][resource][id]}"
        }
      }
    }
    if [data][message] {
      mutate {
        add_field => { "message" => "%{[data][message]}" }
      }
    }
    if [data][trace_id] {
      mutate {
        add_field => { "trace_id" => "%{[data][trace_id]}" }
      }
    }
    date {
      match => ["[data][timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "huy-audit"
    action => "create"
    document_id => "%{[id]}"
    pipeline => "huy-audit-ecs"
  }
}

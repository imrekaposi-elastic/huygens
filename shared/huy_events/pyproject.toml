[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huy-events"
version = "0.1.0"
description = "Shared Kafka CloudEvents client for Huygens control plane"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "opentelemetry-api>=1.28.0",
    "aiokafka>=0.11.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "opentelemetry-sdk>=1.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/huy_events"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huy-auth"
version = "0.1.0"
description = "Shared JWT RBAC and agent token vault helpers for Huygens control plane"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/huy_auth"]

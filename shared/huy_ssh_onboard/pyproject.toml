[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huy-ssh-onboard"
version = "0.1.0"
description = "Hypervisor-agnostic guest SSH onboarding for Huygens audited access"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/huy_ssh_onboard"]

[tool.hatch.build.targets.wheel.force-include]
"src/huy_ssh_onboard/scripts/huy-ssh-onboard.sh" = "huy_ssh_onboard/scripts/huy-ssh-onboard.sh"

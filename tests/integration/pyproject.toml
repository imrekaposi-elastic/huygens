[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huygens-integration-tests"
version = "0.1.0"
description = "Cross-service integration tests against docker compose stack"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.optional-dependencies]
dev = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
pythonpath = ["."]
markers = [
    "integration: requires HUY_E2E=1 and a running compose stack",
    "requires_agent: needs at least one connected libvirt agent in the target org",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huy-projects"
version = "0.2.0"
description = "Huygens project service and libvirt agent proxy (Phase 3)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "httpx>=0.27.0",
    "huy-auth",
    "huy-events",
    "huy-ssh-onboard",
    "huy-telemetry",
    "cryptography>=43.0.0",
]

[tool.uv.sources]
huy-auth = { path = "../../shared/huy_auth", editable = true }
huy-events = { path = "../../shared/huy_events", editable = true }
huy-ssh-onboard = { path = "../../shared/huy_ssh_onboard", editable = true }
huy-telemetry = { path = "../../shared/huy_telemetry", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
]

[project.scripts]
huy-projects = "huy_projects.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/huy_projects"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "../../shared/huy_auth/src", "../../shared/huy_events/src", "../../shared/huy_ssh_onboard/src", "../../shared/huy_telemetry/src"]
markers = [
    "integration: cross-service tests (not run in default unit CI job)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

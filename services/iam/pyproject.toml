[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huy-iam"
version = "0.2.0"
description = "Huygens IAM service (local auth, Keycloak OIDC, RBAC)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "email-validator>=2.2.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "huy-events",
    "huy-ssh-onboard",
    "huy-telemetry",
]

[tool.uv.sources]
huy-events = { path = "../../shared/huy_events", editable = true }
huy-ssh-onboard = { path = "../../shared/huy_ssh_onboard", editable = true }
huy-telemetry = { path = "../../shared/huy_telemetry", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[project.scripts]
huy-iam = "huy_iam.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/huy_iam"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "../../shared/huy_events/src", "../../shared/huy_telemetry/src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huy-registry"
version = "0.0.1"
description = "Huygens agent registry and token vault"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
]

[project.scripts]
huy-registry = "huy_registry.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/huy_registry"]

[tool.ruff]
line-length = 110
target-version = "py311"

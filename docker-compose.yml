# Huygens local mock stack — control plane + dependencies.
#
#   cp compose.env.example .env
#   docker compose up -d --build
#
# With Kafka (Phase 1+ event bus):
#   docker compose --profile kafka up -d --build

name: huygens

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-huy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huy}
      POSTGRES_DB: ${POSTGRES_DB:-huy}
    ports:
      - "5432:5432"
    volumes:
      - huygens-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-huy} -d ${POSTGRES_DB:-huy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  iam:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_DIR: services/iam
        RUN_SCRIPT: huy-iam
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-huy}:${POSTGRES_PASSWORD:-huy}@postgres:5432/${POSTGRES_DB:-huy}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-minimum-32-chars}
      JWT_ISSUER: ${JWT_ISSUER:-huy-iam}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-platform-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-platform-admin-dev}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-platform-admin@example.com}
      HUY_IAM_HOST: 0.0.0.0
      HUY_IAM_PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  registry:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_DIR: services/registry
        RUN_SCRIPT: huy-registry
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-huy}:${POSTGRES_PASSWORD:-huy}@postgres:5432/${POSTGRES_DB:-huy}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      HUY_REGISTRY_HOST: 0.0.0.0
      HUY_REGISTRY_PORT: "8082"
    depends_on:
      postgres:
        condition: service_healthy
      iam:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  inventory:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_DIR: services/inventory
        RUN_SCRIPT: huy-inventory
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-huy}:${POSTGRES_PASSWORD:-huy}@postgres:5432/${POSTGRES_DB:-huy}
      REGISTRY_URL: http://registry:8082
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      HUY_INVENTORY_HOST: 0.0.0.0
      HUY_INVENTORY_PORT: "8083"
    depends_on:
      postgres:
        condition: service_healthy
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  kafka:
    image: apache/kafka:3.7.0
    profiles: [kafka]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  huygens-pgdata:

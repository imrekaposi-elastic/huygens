# Huygens local mock stack — control plane + dependencies.
#
#   cp compose.env.example .env
#   docker compose up -d --build
#
# Stack includes PostgreSQL + Kafka (required). Keycloak SSO (Phase 2):
#   docker compose --profile sso up -d --build

name: huygens

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-huy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huy}
      POSTGRES_DB: ${POSTGRES_DB:-huy}
    ports:
      - "5432:5432"
    volumes:
      - huygens-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-huy} -d ${POSTGRES_DB:-huy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  iam:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_DIR: services/iam
        RUN_SCRIPT: huy-iam
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-huy}:${POSTGRES_PASSWORD:-huy}@postgres:5432/${POSTGRES_DB:-huy}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-minimum-32-chars}
      JWT_ISSUER: ${JWT_ISSUER:-huy-iam}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-platform-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-platform-admin-dev}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-platform-admin@example.com}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://keycloak:8080/realms/huygens}
      OIDC_REALM: ${OIDC_REALM:-huygens}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-huy-iam}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-huy-iam-dev-secret}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://127.0.0.1:8081/api/v1/auth/oidc/callback}
      HUY_IAM_HOST: 0.0.0.0
      HUY_IAM_PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  registry:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_DIR: services/registry
        RUN_SCRIPT: huy-registry
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-huy}:${POSTGRES_PASSWORD:-huy}@postgres:5432/${POSTGRES_DB:-huy}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-minimum-32-chars}
      JWT_ISSUER: ${JWT_ISSUER:-huy-iam}
      AGENT_TOKEN_ENCRYPTION_KEY: ${AGENT_TOKEN_ENCRYPTION_KEY:-dev-agent-token-encryption-key-change-me}
      INVENTORY_URL: http://inventory:8083
      INVENTORY_SERVICE_TOKEN: ${INVENTORY_SERVICE_TOKEN:-dev-inventory-service-token}
      PROJECTS_SERVICE_TOKEN: ${PROJECTS_SERVICE_TOKEN:-dev-projects-service-token}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      HUY_REGISTRY_HOST: 0.0.0.0
      HUY_REGISTRY_PORT: "8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      iam:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  inventory:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_DIR: services/inventory
        RUN_SCRIPT: huy-inventory
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-huy}:${POSTGRES_PASSWORD:-huy}@postgres:5432/${POSTGRES_DB:-huy}
      REGISTRY_URL: http://registry:8082
      PROJECTS_URL: http://projects:8084
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-minimum-32-chars}
      JWT_ISSUER: ${JWT_ISSUER:-huy-iam}
      INVENTORY_SERVICE_TOKEN: ${INVENTORY_SERVICE_TOKEN:-dev-inventory-service-token}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      HUY_INVENTORY_HOST: 0.0.0.0
      HUY_INVENTORY_PORT: "8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  breakout-controller:
    build:
      context: .
      dockerfile: docker/Dockerfile.breakout-controller
    ports:
      - "8085:8085"
    environment:
      HUY_BREAKOUT_HOST: 0.0.0.0:8085
      BREAKOUT_SERVICE_TOKEN: ${BREAKOUT_SERVICE_TOKEN:-dev-breakout-service-token}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8085/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  projects:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_DIR: services/projects
        RUN_SCRIPT: huy-projects
    ports:
      - "8084:8084"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-huy}:${POSTGRES_PASSWORD:-huy}@postgres:5432/${POSTGRES_DB:-huy}
      REGISTRY_URL: http://registry:8082
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-minimum-32-chars}
      JWT_ISSUER: ${JWT_ISSUER:-huy-iam}
      AGENT_TOKEN_ENCRYPTION_KEY: ${AGENT_TOKEN_ENCRYPTION_KEY:-dev-agent-token-encryption-key-change-me}
      PROJECTS_SERVICE_TOKEN: ${PROJECTS_SERVICE_TOKEN:-dev-projects-service-token}
      INVENTORY_SERVICE_TOKEN: ${INVENTORY_SERVICE_TOKEN:-dev-inventory-service-token}
      BREAKOUT_CONTROLLER_URL: http://breakout-controller:8085
      BREAKOUT_SERVICE_TOKEN: ${BREAKOUT_SERVICE_TOKEN:-dev-breakout-service-token}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      HUY_PROJECTS_HOST: 0.0.0.0
      HUY_PROJECTS_PORT: "8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      registry:
        condition: service_healthy
      breakout-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  compliance:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_DIR: services/compliance
        RUN_SCRIPT: huy-compliance
    ports:
      - "8086:8086"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-huy}:${POSTGRES_PASSWORD:-huy}@postgres:5432/${POSTGRES_DB:-huy}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-minimum-32-chars}
      JWT_ISSUER: ${JWT_ISSUER:-huy-iam}
      REGISTRY_URL: http://registry:8082
      PROJECTS_URL: http://projects:8084
      PROJECTS_SERVICE_TOKEN: ${PROJECTS_SERVICE_TOKEN:-dev-projects-service-token}
      CHECK_ALERT_ENABLED: ${CHECK_ALERT_ENABLED:-true}
      OBJECT_STORE_KIND: ${OBJECT_STORE_KIND:-s3}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-huygens-dev}
      OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:-http://seaweed-s3:8333}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-us-east-1}
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:-huy-dev-access-key}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:-huy-dev-secret-key}
      OBJECT_STORE_PREFIX: ${OBJECT_STORE_PREFIX:-huy-compliance}
      HUY_COMPLIANCE_HOST: 0.0.0.0
      HUY_COMPLIANCE_PORT: "8086"
    depends_on:
      postgres:
        condition: service_healthy
      registry:
        condition: service_healthy
      projects:
        condition: service_healthy
      seaweed-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8086/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Development object store backend (S3-compatible, internal only; no published ports).
  seaweed-master:
    image: chrislusf/seaweedfs:latest
    command: ["master", "-ip=seaweed-master", "-port=9333", "-mdir=/data"]
    volumes:
      - huygens-seaweed-master:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  seaweed-volume:
    image: chrislusf/seaweedfs:latest
    command:
      [
        "volume",
        "-ip=seaweed-volume",
        "-port=8080",
        "-dir=/data",
        "-max=0",
        "-mserver=seaweed-master:9333"
      ]
    volumes:
      - huygens-seaweed-volume:/data
    depends_on:
      seaweed-master:
        condition: service_healthy
    # The volume server has historically exposed different HTTP status paths across versions.
    # For the dev stack, treat "container started" as sufficient; master/filer/s3 are still
    # gated by their own health checks.
    healthcheck:
      test: ["CMD", "true"]

  seaweed-filer:
    image: chrislusf/seaweedfs:latest
    command: ["filer", "-ip=seaweed-filer", "-port=8888", "-master=seaweed-master:9333"]
    volumes:
      - huygens-seaweed-filer:/data
    depends_on:
      seaweed-master:
        condition: service_healthy
      seaweed-volume:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  seaweed-s3:
    image: chrislusf/seaweedfs:latest
    command:
      [
        "s3",
        "-filer=seaweed-filer:8888",
        "-port=8333",
        "-config=/config/s3.json"
      ]
    volumes:
      - ./docker/seaweedfs/s3.json:/config/s3.json:ro
    depends_on:
      seaweed-filer:
        condition: service_started
    # The S3 gateway may not reliably return 200 on "/" across versions/config.
    # For the dev stack, treat "container started" as sufficient; the init job
    # will fail fast if the endpoint is actually unreachable.
    healthcheck:
      test: ["CMD", "true"]

  # One-shot: create the default dev bucket and keep it private.
  seaweed-init:
    image: amazon/aws-cli:2.24.0
    depends_on:
      seaweed-s3:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:-huy-dev-access-key}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:-huy-dev-secret-key}
      AWS_DEFAULT_REGION: ${OBJECT_STORE_REGION:-us-east-1}
      S3_ENDPOINT: ${OBJECT_STORE_ENDPOINT:-http://seaweed-s3:8333}
      S3_BUCKET: ${OBJECT_STORE_BUCKET:-huygens-dev}
    entrypoint:
      [
        "/bin/sh",
        "-lc",
        "set -euo pipefail; \
         echo \"Initializing SeaweedFS S3 bucket: $$S3_BUCKET\"; \
         aws --endpoint-url \"$$S3_ENDPOINT\" s3api create-bucket --bucket \"$$S3_BUCKET\" 2>/dev/null || true; \
         aws --endpoint-url \"$$S3_ENDPOINT\" s3api put-bucket-acl --bucket \"$$S3_BUCKET\" --acl private >/dev/null 2>&1 || true; \
         aws --endpoint-url \"$$S3_ENDPOINT\" s3 ls \"s3://$$S3_BUCKET\" >/dev/null; \
         echo \"SeaweedFS bucket ready.\""
      ]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "5173:80"
    depends_on:
      iam:
        condition: service_healthy
      registry:
        condition: service_healthy
      inventory:
        condition: service_healthy
      projects:
        condition: service_healthy
      compliance:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: [sso]
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # One-shot: create huy.* application topics before producers start (ADR 0004, Phase 6 B4).
  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-1}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
    volumes:
      - ./docker/kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    restart: "no"

volumes:
  huygens-pgdata:
  huygens-seaweed-master:
  huygens-seaweed-volume:
  huygens-seaweed-filer:

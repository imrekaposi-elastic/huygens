# Default CI: unit tests and integration tests per microservice.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - test-huy-auth
          - test-huy-events
          - test-huy-telemetry
          - test-iam
          - test-registry
          - test-inventory
          - test-projects
          - test-compliance
          - test-agent-libvirt
          - test-breakout-controller
          - test-ssh-gateway
          - test-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: matrix.target == 'test-web'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        if: matrix.target == 'test-breakout-controller' || matrix.target == 'test-ssh-gateway'
        with:
          go-version: "1.25"

      - name: Run unit tests
        run: make ${{ matrix.target }}

  integration:
    name: Integration (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Limit parallel Hub pulls (postgres/aws-cli use ECR public mirrors).
      max-parallel: 3
      matrix:
        service:
          - stack
          - iam
          - registry
          - inventory
          - projects
          - web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          fi

      - name: Prepare Compose env
        run: cp compose.env.example .env

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for healthy services
        run: bash scripts/wait-for-stack.sh

      - name: Run integration tests
        run: make test-integration-${{ matrix.service }}

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

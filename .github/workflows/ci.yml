# Default CI: unit tests and integration tests per microservice.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - test-huy-auth
          - test-huy-events
          - test-huy-telemetry
          - test-iam
          - test-registry
          - test-inventory
          - test-projects
          - test-compliance
          - test-agent-libvirt
          - test-breakout-controller
          - test-ssh-gateway
          - test-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: matrix.target == 'test-web'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        if: matrix.target == 'test-breakout-controller' || matrix.target == 'test-ssh-gateway'
        with:
          go-version: "1.25"

      - name: Run unit tests
        run: make ${{ matrix.target }}

  # One Compose stack per workflow run. A matrix of integration jobs each pulls
  # kafka + seaweedfs from Docker Hub and hits anonymous rate limits (toomanyrequests).
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          else
            echo "No DOCKERHUB_* secrets; relying on ECR mirrors and a single compose pull."
          fi

      - name: Prepare Compose env
        run: cp compose.env.example .env

      - name: Pull and start stack
        run: make compose-up-ci

      - name: Wait for healthy services
        run: bash scripts/wait-for-stack.sh

      - name: Install integration test dependencies
        run: make test-integration-deps

      - name: Integration (stack)
        run: make test-integration-stack

      - name: Integration (iam)
        run: make test-integration-iam

      - name: Integration (registry)
        run: make test-integration-registry

      - name: Integration (inventory)
        run: make test-integration-inventory

      - name: Integration (projects)
        run: make test-integration-projects

      - name: Integration (web)
        run: make test-integration-web

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

name: "Huygens CodeQL"

# Limit analysis to application source (no venvs, caches, or build output).
paths:
  - services
  - agents/libvirt/src
  - shared
  - web

paths-ignore:
  - .venv-ci-sim
  - "**/.venv"
  - "**/venv"
  - "**/node_modules"
  - "**/__pycache__"
  - "**/.pytest_cache"
  - web/dist
  - agents/libvirt/data
  - "**/*.egg-info"
